<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3faff">
  <meta name="referrer" content="no-referrer">
  <title>Больше, чем просто плавание</title>
  <link rel="stylesheet" href="./swim/style.css">
  <script type="module" src="./swim/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">≈</span>
        <span>Больше, чем просто плавание</span>
      </a>
      <a class="role-link" id="role-link" href="?coach">Кабинет тренера</a>
    </div>
  </header>
  <main class="shell" id="app">
    <section class="welcome" aria-labelledby="welcome-title">
      <div class="pool-panel">
        <div class="pool-water" aria-hidden="true"></div>
        <div class="pool-text">
          <h1 id="welcome-title">Расписание<br>тренировок</h1>
          <p>Даты и время ваших занятий по плаванию.</p>
        </div>
      </div>
      <div class="card login-card">
        <h2>Вход ученика</h2>
        <p class="muted">Введите свой номер телефона и код, который выдал тренер.</p>
        <form id="student-login">
          <label>Номер телефона <input name="phone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00" required maxlength="40"></label>
          <label>Персональный код <input name="code" type="password" autocomplete="current-password" spellcheck="false" required maxlength="64"></label>
          <button class="primary" type="submit">Войти в расписание</button>
          <p class="message" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <noscript><p class="shell">Для входа в расписание включите JavaScript.</p></noscript>
</body>
</html>
